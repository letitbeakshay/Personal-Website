<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Let's talk | Akshay</title>
  <meta name="description" content="Get in touch.">
  <meta name="theme-color" content="#161616">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400..600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>try{var t=localStorage.getItem("theme");if(!t)t="dark";document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link rel="stylesheet" href="../assets/site.css">
</head>
<body data-page="talk" data-root="../">
  <a class="skip" href="#content">Skip to content</a>
  <div class="shell">
    <aside id="side"></aside>
    <main id="content">
      <div class="col">
        <div class="intro">
          <h1>Let's talk</h1>
          <p class="lede">If something here resonates, I'd like to hear from you.</p>
        </div>

        <section aria-labelledby="h-mail">
          <div class="sec-head"><h2 id="h-mail">Email</h2></div>
          <p class="prose">Keep it short and to the point.</p>
          <div id="mail"></div>
          <p class="hint" id="copy-email" hidden>Press <kbd>C</kbd> <span data-msg>to copy my email</span></p>
        </section>

        <section aria-labelledby="h-else">
          <div class="sec-head"><h2 id="h-else">Elsewhere</h2></div>
          <div class="grid three" id="socials"></div>
        </section>
      </div>
      <footer class="foot"><span>© <span id="year"></span> Akshay</span><button id="top" type="button">Top ↑</button></footer>
    </main>
  </div>
  <script src="../assets/data.js"></script>
  <script src="../assets/config.js"></script>
  <script src="../assets/site.js"></script>
  <script>
    whenData(function () {
      var mail = document.getElementById("mail"), soc = document.getElementById("socials");
      if (SITE.email) {
        mail.innerHTML = '<button class="btn primary" id="copy" type="button">Copy email address</button> <a class="btn ghost" href="mailto:' + esc(SITE.email) + '">Open in mail app</a>';
        document.getElementById("copy").addEventListener("click", function () {
          var b = this; navigator.clipboard.writeText(SITE.email).then(function () { b.textContent = "Copied"; setTimeout(function () { b.textContent = "Copy email address"; }, 1600); });
        });
      } else if (!LIVE) {
        mail.innerHTML = '<div class="demo"><b>TODO</b><span>Add your email in the admin panel (Settings).</span></div>';
      }
      var links = (SITE.socials || []).filter(function (x) { return x.url; });
      if (links.length) {
        soc.innerHTML = links.map(function (x) {
          return '<a class="tile" href="' + esc(x.url) + '" target="_blank" rel="noopener noreferrer"><h3>' + esc(x.name) + " <span>↗</span></h3><p>" + esc(x.handle || "") + "</p></a>";
        }).join("");
      } else if (LIVE) {
        document.getElementById("h-else").closest("section").remove();
      } else {
        soc.outerHTML = '<div class="demo"><b>TODO</b><span>Add your profiles in the admin panel (Settings).</span></div>';
      }
    });
  </script>
</body>
</html>
