<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Let's talk — Akshay</title>
  <meta name="description" content="Get in touch.">
  <meta name="theme-color" content="#161616">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400..600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>try{var t=localStorage.getItem("theme");if(!t)t="dark";document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link rel="stylesheet" href="../assets/site.css">
</head>
<body data-page="talk" data-root="../">
  <a class="skip" href="#content">Skip to content</a>
  <div class="shell">
    <aside id="side"></aside>
    <main id="content">
      <div class="col">
        <div class="hero">
          <p class="eyebrow">Let's talk</p>
          <h1>Let's talk, <em>openly.</em></h1>
          <p class="lede">If something here resonates, I'd like to hear from you. Tell me what you're working on and what you'd like to talk about.</p>
          <p class="hint" id="copy-email" hidden>Press <kbd>C</kbd> <span data-msg>to copy my email</span></p>
        </div>
        <section aria-labelledby="h-msg">
          <div class="sec-head"><h2 id="h-msg">Send a message</h2></div>
          <form class="stack" id="msgform">
            <div class="field"><label for="n">Name</label><input id="n" name="name" required maxlength="100" autocomplete="name"></div>
            <div class="field"><label for="e">Email</label><input id="e" name="email" type="email" required maxlength="200" autocomplete="email"></div>
            <div class="field"><label for="m">Message</label><textarea id="m" name="message" required maxlength="2000"></textarea></div>
            <div class="field" style="position:absolute;left:-9999px" aria-hidden="true"><label for="website">Leave this empty</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
            <div><button class="btn primary" type="submit">Send message</button></div>
            <div class="formmsg" id="msg" role="status"></div>
          </form>
        </section>
      </div>
      <footer class="foot"><span>© <span id="year"></span> Akshay</span><button id="top" type="button">Scroll to top ↑</button></footer>
    </main>
  </div>
  <script src="../assets/data.js"></script>
  <script src="../assets/site.js"></script>
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm";
    // Public values: safe in the browser because Row Level Security only allows inserts.
    const supabase = createClient("https://lfrruybrnycexlavpofx.supabase.co", "sb_publishable_gKgQoz4ysK9ORXq6SuGhQQ_NI7sfTI1");
    const form = document.getElementById("msgform"), msg = document.getElementById("msg");
    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const data = Object.fromEntries(new FormData(form));
      if (data.website) { msg.textContent = "Thanks. I'll get back to you."; return; } // spam trap
      const btn = form.querySelector("button"); btn.disabled = true; msg.textContent = "Sending…";
      const { error } = await supabase.from("messages").insert({ name: data.name, email: data.email, message: data.message });
      btn.disabled = false;
      if (error) { msg.textContent = "Something went wrong. Please try again."; return; }
      msg.textContent = "Thanks. I'll get back to you."; form.reset();
    });
  </script>
</body>
</html>
