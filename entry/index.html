<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Note | Akshay</title>
  <meta name="description" content="">
  <meta name="theme-color" content="#161616">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400..600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>try{var t=localStorage.getItem("theme");if(!t)t="dark";document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link rel="stylesheet" href="../assets/site.css">
</head>
<body data-page="notes" data-root="../">
  <a class="skip" href="#content">Skip to content</a>
  <div class="shell">
    <aside id="side"></aside>
    <main id="content">
      <div class="col entry">
        <div class="intro" id="entry"></div>
        <a class="back" id="back" href="../notes/">← All notes</a>
      </div>
      <footer class="foot"><span>© <span id="year"></span> Akshay</span><button id="top" type="button">Top ↑</button></footer>
    </main>
  </div>
  <script src="../assets/data.js"></script>
  <script src="../assets/config.js"></script>
  <script src="../assets/site.js"></script>
  <script>
    whenData(function () {
      var id = new URLSearchParams(location.search).get("id");
      var e = ENTRIES.filter(function (x) { return x.id === id; })[0];
      var out = document.getElementById("entry");
      if (!e) {
        document.title = "Not found | Akshay";
        out.innerHTML = '<h1>That note doesn\'t exist.</h1>';
        return;
      }
      setPage(e.kind === "faith" ? "faith" : e.kind === "experiment" ? "experiments" : "notes");
      document.title = e.title + " | Akshay";
      var back = document.getElementById("back");
      back.href = "../" + SECTION[e.kind]; back.textContent = e.kind === "faith" ? "← Faith" : e.kind === "experiment" ? "← All experiments" : "← All notes";
      out.innerHTML = '<h1>' + esc(e.title) + '</h1><div class="meta"><time datetime="' + esc(e.date) + '">' + fmtDate(e.date) + "</time><span>·</span><span>" + esc(e.kind === "experiment" ? (e.tag || "Experiment") : KINDS[e.kind]) + "</span></div>" +
        (e.hypothesis ? '<div class="case" style="margin-bottom:22px"><dl><dt>Hypothesis</dt><dd>' + esc(e.hypothesis) + "</dd><dt>Result</dt><dd>" + esc(e.result || "") + "</dd></dl></div>" : "") +
        '<div class="entry-body">' + e.body.map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("") + "</div>";
    });
  </script>
</body>
</html>
