<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Akshay — Personal Website</title>
  <meta name="description" content="Personal website of Akshay.">
  <style>
    :root { --bg:#fff; --fg:#111; --muted:#666; --line:#e5e5e5; --accent:#2f6fed; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0e0e10; --fg:#f2f2f2; --muted:#9a9a9a; --line:#26262a; --accent:#6c9bff; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui,-apple-system,sans-serif; }
    .wrap { max-width:720px; margin:0 auto; padding:0 16px; }
    header { display:flex; justify-content:space-between; align-items:center; padding:24px 0; }
    nav a { margin-left:16px; color:var(--muted); text-decoration:none; }
    nav a:hover { color:var(--fg); }
    section { padding:48px 0; border-top:1px solid var(--line); }
    h1 { font-size:2.4rem; line-height:1.15; margin:0 0 12px; }
    h2 { font-size:1.3rem; margin:0 0 16px; }
    p { color:var(--muted); margin:0 0 12px; }
    .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); }
    .card { border:1px solid var(--line); border-radius:10px; padding:16px; }
    .card h3 { margin:0 0 6px; font-size:1rem; }
    form { display:grid; gap:12px; }
    input, textarea { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--fg); font:inherit; }
    button { justify-self:start; padding:10px 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
    button:disabled { opacity:.6; cursor:default; }
    #status { min-height:1.4em; font-size:.95rem; }
    footer { padding:32px 0; color:var(--muted); font-size:.9rem; border-top:1px solid var(--line); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <strong>Akshay</strong>
      <nav><a href="#about">About</a><a href="#projects">Projects</a><a href="#contact">Contact</a></nav>
    </header>

    <section id="about" style="border-top:0">
      <h1>Hi, I'm Akshay.</h1>
      <p>A short line about what you do goes here. Replace this text with your own bio.</p>
    </section>

    <section id="projects">
      <h2>Projects</h2>
      <div class="grid">
        <div class="card"><h3>Project one</h3><p>Short description.</p></div>
        <div class="card"><h3>Project two</h3><p>Short description.</p></div>
        <div class="card"><h3>Project three</h3><p>Short description.</p></div>
      </div>
    </section>

    <section id="contact">
      <h2>Get in touch</h2>
      <form id="contact-form">
        <input name="name" placeholder="Your name" required maxlength="100">
        <input name="email" type="email" placeholder="Your email" required maxlength="200">
        <textarea name="message" rows="5" placeholder="Message" required maxlength="2000"></textarea>
        <button type="submit">Send</button>
        <div id="status" role="status"></div>
      </form>
    </section>

    <footer>© <span id="year"></span> Akshay</footer>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm";

    // Public values: safe in the browser because Row Level Security restricts access.
    const supabase = createClient(
      "https://lfrruybrnycexlavpofx.supabase.co",
      "sb_publishable_gKgQoz4ysK9ORXq6SuGhQQ_NI7sfTI1"
    );

    document.getElementById("year").textContent = new Date().getFullYear();

    const form = document.getElementById("contact-form");
    const status = document.getElementById("status");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = form.querySelector("button");
      btn.disabled = true;
      status.textContent = "Sending…";
      const { name, email, message } = Object.fromEntries(new FormData(form));
      const { error } = await supabase.from("messages").insert({ name, email, message });
      if (error) {
        status.textContent = "Something went wrong. Please try again.";
        btn.disabled = false;
      } else {
        status.textContent = "Thanks! Your message was sent.";
        form.reset();
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
