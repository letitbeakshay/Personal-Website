<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archive — Akshay</title>
  <meta name="description" content="Thoughts, resources, memories and decisions, indexed by time.">
  <meta name="theme-color" content="#f5f5f2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>try{var t=localStorage.getItem("theme");if(!t)t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link rel="stylesheet" href="../assets/site.css">
</head>
<body data-page="archive" data-root="../">
  <a class="skip" href="#content">Skip to content</a>
  <div class="shell">
    <aside id="side"></aside>
    <main id="content">
      <div class="col">
        <div class="hero" style="padding-bottom:20px">
          <p class="eyebrow">Archive</p>
          <h1>Everything I've <em>logged.</em></h1>
          <p class="lede">Past focus, decisions, and learnings. Thoughts, resources and memories, newest first.</p>
        </div>

        <div class="demo"><b>DEMO</b><span>Entries are placeholders. Add your own in assets/data.js.</span></div>

        <div class="controls">
          <input class="search" id="q" type="search" placeholder="Search the archive…" aria-label="Search the archive">
          <div class="chips" id="chips" role="group" aria-label="Filter by type"></div>
        </div>
        <div id="out" aria-live="polite"></div>
      </div>
      <footer class="foot"><span>© <span id="year"></span> Akshay</span><button id="top" type="button">Scroll to top ↑</button></footer>
    </main>
  </div>
  <script src="../assets/data.js"></script>
  <script src="../assets/site.js"></script>
  <script>
    var kind = "all", term = "";
    var chips = document.getElementById("chips");
    var opts = [["all", "All"]].concat(Object.keys(KINDS).map(function (k) { return [k, k === "memory" ? "Memories" : KINDS[k] + "s"]; }));
    chips.innerHTML = opts.map(function (o) {
      return '<button class="chip" type="button" data-k="' + o[0] + '" aria-pressed="' + (o[0] === "all") + '">' + o[1] + "</button>";
    }).join("");

    function render() {
      var list = ARCHIVE.filter(function (e) {
        var hay = (e.title + " " + e.summary + " " + e.body.join(" ")).toLowerCase();
        return (kind === "all" || e.kind === kind) && hay.indexOf(term) !== -1;
      }).sort(function (a, b) { return b.date.localeCompare(a.date); });
      if (!list.length) { document.getElementById("out").innerHTML = '<p class="empty">Nothing matches yet.</p>'; return; }
      var html = "", cur = "";
      list.forEach(function (e) {
        var m = new Date(e.date + "T00:00:00").toLocaleDateString("en-GB", { month: "long", year: "numeric" });
        if (m !== cur) { if (cur) html += "</ul>"; html += '<div class="month">' + m + '</div><ul class="rows">'; cur = m; }
        html += rowHTML(e);
      });
      document.getElementById("out").innerHTML = html + "</ul>";
    }
    chips.addEventListener("click", function (e) {
      var b = e.target.closest(".chip"); if (!b) return;
      kind = b.getAttribute("data-k");
      chips.querySelectorAll(".chip").forEach(function (c) { c.setAttribute("aria-pressed", c === b); });
      render();
    });
    document.getElementById("q").addEventListener("input", function () { term = this.value.trim().toLowerCase(); render(); });
    render();
  </script>
</body>
</html>
